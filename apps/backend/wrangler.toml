name = "selfie-mvp-backend"
main = "src/index.ts"
compatibility_date = "2025-01-09"
# enable_nodejs_process_v2 is required by @worldcoin/idkit-server's
# environment check (needs process.versions.node on Workers).
compatibility_flags = ["nodejs_compat", "enable_nodejs_process_v2"]

# <PLACEHOLDER> values are injected by CI from GitHub secrets on deploy.

[[d1_databases]]
binding = "DB"
database_name = "selfie-db"
database_id = "<D1_DATABASE_ID>"

[[kv_namespaces]]
binding = "KV"
id = "<KV_NAMESPACE_ID>"

[[durable_objects.bindings]]
name = "WORLD_ID_SESSION"
class_name = "WorldIdSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldIdSession"]

# Secrets (wrangler secret put): JWT_SECRET, STREAM_API_TOKEN,
# STREAM_WEBHOOK_SECRET, WORLD_RP_SIGNING_KEY. Local dev reads .dev.vars.
[vars]
ENVIRONMENT = "production"
STREAM_ACCOUNT_ID = "<CF_ACCOUNT_ID>"
STREAM_CUSTOMER_CODE = "<STREAM_CUSTOMER_CODE>"
WORLD_APP_ID = "<WORLD_APP_ID>"
WORLD_RP_ID = "<WORLD_RP_ID>"
WORLD_ACTION = "go-selfie"
WORLD_ENV = "production"
APP_SCHEME = "selfie"
WORLD_VERIFY_MODE = "live"

[observability]
enabled = true
