# Deploys the Cloudflare Worker (apps/backend) on every push to main.
#
# Before deploying, replaces the <PLACEHOLDER> tokens in wrangler.toml with
# values from GitHub secrets (repo → Settings → Secrets and variables → Actions):
#
#   Config placeholders (injected into wrangler.toml):
#     D1_DATABASE_ID, KV_NAMESPACE_ID, CF_ACCOUNT_ID,
#     STREAM_CUSTOMER_CODE, WORLD_APP_ID, WORLD_RP_ID
#
#   Auth:
#     CLOUDFLARE_API_TOKEN  (token with Workers Scripts:Edit, D1:Edit, KV:Edit)
#
#   Worker runtime secrets (optional — synced via `wrangler secret put` if set):
#     JWT_SECRET, STREAM_API_TOKEN, STREAM_WEBHOOK_SECRET, WORLD_RP_SIGNING_KEY

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/common/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm --filter @selfie/backend typecheck

      - name: Inject config into wrangler.toml
        working-directory: apps/backend
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          STREAM_CUSTOMER_CODE: ${{ secrets.STREAM_CUSTOMER_CODE }}
          WORLD_APP_ID: ${{ secrets.WORLD_APP_ID }}
          WORLD_RP_ID: ${{ secrets.WORLD_RP_ID }}
        run: |
          set -euo pipefail
          for name in D1_DATABASE_ID KV_NAMESPACE_ID CF_ACCOUNT_ID STREAM_CUSTOMER_CODE WORLD_APP_ID WORLD_RP_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
            sed -i "s|<$name>|$value|g" wrangler.toml
          done
          # Fail loudly if any placeholder slipped through.
          # `^[^#]*` ignores placeholders inside comments (e.g. the
          # `wrangler secret put <NAME>` doc line) — only real config values count.
          if grep -En '^[^#]*<[A-Z_]+>' wrangler.toml; then
            echo "::error::Unreplaced placeholders remain in wrangler.toml (see lines above)"
            exit 1
          fi
          echo "wrangler.toml: all placeholders injected"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: pnpm
          command: deploy

      - name: Sync Worker secrets
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STREAM_API_TOKEN: ${{ secrets.STREAM_API_TOKEN }}
          STREAM_WEBHOOK_SECRET: ${{ secrets.STREAM_WEBHOOK_SECRET }}
          WORLD_RP_SIGNING_KEY: ${{ secrets.WORLD_RP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for name in JWT_SECRET STREAM_API_TOKEN STREAM_WEBHOOK_SECRET WORLD_RP_SIGNING_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name"
              echo "synced secret: $name"
            else
              echo "skipped secret: $name (GitHub secret not set)"
            fi
          done
